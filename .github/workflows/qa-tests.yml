
name: QA Automation Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  qa-tests:
    runs-on: ubuntu-latest

    env:
      CI_HEADLESS: true

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run QA automation tests
        run: mvn --batch-mode clean test -Denv=qa -Dsurefire.suiteXmlFiles=testng-ci.xml

      - name: Upload HTML test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QA-Test-Reports
          path: |
            target/**/*.html
            reports/**/*.html
          if-no-files-found: warn
          retention-days: 14
